<div class="modal fade modal-subscribe" tabindex="-1" role="dialog" aria-labelledby="modal-subscribe">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">產品價格訂閱</h4>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <form class="my-2" id="subscribeForm" novalidate>
                    <p>
                        當有任何價格事件發生，我們會發信件通知您。
                    </p>
                    <div class="form-group">
                        <input class="form-control" id="emailAddress" type="email" required placeholder="請輸入正確 email" />
                        <div class="invalid-feedback text-left">請輸入有效的 Email</div>
                    </div>
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-warning">通知我</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
