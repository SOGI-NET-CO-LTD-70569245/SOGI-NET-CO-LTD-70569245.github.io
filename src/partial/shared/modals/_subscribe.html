<div class="modal fade modal-subscribe" tabindex="-1" role="dialog" aria-labelledby="modal-subscribe">
    <div class="modal-dialog modal-sm" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">產品價格訂閱</div>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <div class="text-center">
                    <form class="my-2" id="subscribeForm" novalidate>
                        <div class="form-group">
                            <input class="form-control" id="emailAddress" type="email" required placeholder="請輸入正確 email" />
                            <div class="invalid-feedback text-left">請輸入有效的 Email</div>
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn btn-block btn-primary mt-2">通知我</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
