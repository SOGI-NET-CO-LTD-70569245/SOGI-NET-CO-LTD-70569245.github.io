<!--
@partial shared/modals/_toast
@optional type, title, desc
@variants type: success renders the green check style; anything else (default) renders the red alert style.
@note Without title/desc it shows the default member "門號已鎖定" message, so existing member pages are unchanged.
-->
<div class="modal fade modal-toast" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content toast mx-auto show @@if(context.type=='success'){rounded-sm mt-n20}@@if(context.type!='success'){rounded-0 border-danger}" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-body">
                <div class="row">
                    <div class="col-auto align-self-center">
                        @@if(context.type=='success'){
                        <div class="text-success h1">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        }
                        @@if(context.type!='success'){
                        <div class="text-danger h1">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        }
                    </div>
                    <div class="col">
                        @@if(context.title){
                        <div class="font-weight-bold h5">@@title</div>
                        @@desc
                        }
                        @@if(!context.title){
                        <div class="font-weight-bold h5">門號已鎖定！</div>
                        你的門號已超過驗證上限，請<a class="text-decoration-underline" href="#">聯繫客服</a>獲得協助。
                        }
                    </div>
                    <div class="col-auto">
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
