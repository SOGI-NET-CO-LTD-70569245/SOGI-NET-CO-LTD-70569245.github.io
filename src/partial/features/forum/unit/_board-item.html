<!--
@partial features/forum/unit/_board-item
@required title, img
@optional desc, href
-->
<div class="col-lg-4 col-sm-6 col-12">
    <a class="row no-gutters box my-2 p-2" href="@@if(context.href){@@href}@@if(!context.href){list.html}">
        <div class="col-md-4 text-center">
            <img class="img-fluid" src="@@img" alt="@@title">
        </div>
        <div class="col-md-8">
            <div class="text-black text-row-2">@@title</div>
            @@if(context.desc){
            <small class="text-muted text-row-2">
                @@desc
            </small>
            }
        </div>
    </a>
</div>
