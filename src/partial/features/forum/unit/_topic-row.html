<!--
@partial features/forum/unit/_topic-row
@required title
@optional href, reply, view, author, authorMax5, lastDate, lastUser, lastUserMax5, warning, ad, top, official, best, hot
-->
<tr@@if(context.warning){ class="warning"}>
    <td class="text-center">@@if(!context.ad){<input type="checkbox">}</td>
    <td>
        @@if(context.top){
        <span class="badge badge-secondary" data-toggle="tooltip" data-placement="top" title="置頂">
            <i class="fas fa-fw fa-arrow-circle-up"></i></span>
        }
        @@if(context.official){
        <span class="badge badge-warning" data-toggle="tooltip" data-placement="top" title="站方">
            <i class="fas fa-fw fa-bookmark"></i>
        </span>
        }
        @@if(context.best){
        <span class="badge badge-info" data-toggle="tooltip" data-placement="top" title="精華">
            <i class="fas fa-fw fa-star"></i>
        </span>
        }
        @@if(context.hot){
        <span class="badge badge-danger" data-toggle="tooltip" data-placement="top" title="爆">
            <i class="fas fa-fw fa-fire"></i>
        </span>
        }
        <a href="@@if(context.href){@@href}@@if(!context.href){detail.html}">@@title</a>
    </td>
    <td class="text-center"><small>@@reply</small></td>
    <td class="text-center"><small class="text-danger">@@view</small></td>
    <td class="text-center"><a href=""@@if(context.authorMax5){ class="text-max-5"}><small>@@author</small></a></td>
    <td>
        <small class="text-muted">@@lastDate @@if(context.lastUserMax5){<span class="text-max-5">@@lastUser</span>}@@if(!context.lastUserMax5){@@lastUser}</small>
    </td>
</tr>
